name: Build and upload JAR with dependencies

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Find JAR with dependencies
      id: find-jar
      run: |
        JAR_PATH=$(find target -name '*jar-with-dependencies.jar' | head -n 1)
        if [ -z "$JAR_PATH" ]; then
          echo "JAR not found!" >&2
          exit 1
        fi
        echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"
    - name: Upload release asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.PAT }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ${{ steps.find-jar.outputs.jar_path }}
        asset_name: treesql-${{ github.event.release.tag_name }}.jar
        asset_content_type: application/octet-stream
